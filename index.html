<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<meta name="color-scheme" content="dark">
<meta name="description" content="Stereo Sandbox: a voxel world to build in, right in the browser, with shadows, volumetric clouds and reflective water.">
<title>Stereo Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Stereo Sandbox game view"></canvas>
<div id="ui"><div class="screen title-screen boot is-open" aria-hidden="true"><div class="title-main"><div class="brand"><div class="logo-mark"></div><div class="logo"><span class="logo-word">Stereo</span> <span class="logo-word">Sandbox</span></div><p class="tagline">A voxel world to build in</p></div><div class="title-menu"><p class="boot-status">Loading</p></div></div></div></div>
<noscript><p style="position:fixed;inset:auto 0 24px;text-align:center;color:#f3eee3;font:15px/1.5 system-ui,sans-serif">Stereo Sandbox needs JavaScript to run.</p></noscript>
<script>
  // Until the UI replaces the splash, a failed module load or boot error shows up here instead of an endless "Loading".
  addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName && t.tagName !== 'SCRIPT') return;
    var s = document.querySelector('#ui .boot-status');
    if (s) { s.textContent = 'Stereo Sandbox could not start. Reload the page to try again.'; s.classList.add('is-error'); }
  }, true);
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
