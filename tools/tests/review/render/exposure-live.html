<!doctype html>
<html><body style="margin:0;background:#000">
<canvas id="c" style="width:160px;height:90px;display:block"></canvas>
<script type="module">
// Review check: does auto exposure converge to its target at high frame rates? Converge with a
// reset (e = target), then offset the stored exposure by +-0.5 stop and run N frames at 1/hz.
const q = new URLSearchParams(location.search);
if (q.has('nofloat')) {
  const P = WebGL2RenderingContext.prototype, ge = P.getExtension;
  P.getExtension = function (n) { return (n === 'EXT_color_buffer_float' || n === 'EXT_color_buffer_half_float') ? null : ge.call(this, n); };
}
const { Renderer } = await import('../../../../src/renderer.js');
const { buildTextures } = await import('../../../../src/textures.js');
const r = new Renderer(document.getElementById('c'), buildTextures(), { shadows: false, volumetrics: 0, clouds: 0, ssr: 0, bloom: true, fxaa: false, autoResolution: false, renderScale: 1 });
const gl = r.gl;
const f8 = r.hdr.internal === gl.RGBA8;
const read = () => {
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, r.post.exposureTexture, 0);
  let v; if (f8) { const p = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); v = p[0] / 255; } else { const p = new Float32Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, p); v = p[0]; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); return v * 10 - 5; // log2(exposure)
};
const write = (log2e) => {
  const u = (log2e + 5) / 10;
  for (const e of r.post.exposure) {
    gl.bindTexture(gl.TEXTURE_2D, e.tex);
    if (f8) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([Math.round(u * 255), 0, 0, 255]));
    else gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 1, 1, gl.RGBA, gl.FLOAT, new Float32Array([u, 0, 0, 1]));
  }
  gl.bindTexture(gl.TEXTURE_2D, null);
};
const frame = (dt) => r.render({ camPos: [0.5, 80, 0.5], yaw: 0, pitch: 0.2, fov: 1.3, time: 5, dt, timeOfDay: 0.25, underwater: false, eyeSkyLight: 1, cloudCoverage: 0 });
r.post.resetExposure = true; frame(1 / 60); frame(1 / 60);
const target = read();
const out = { hdr: f8 ? 'RGBA8' : 'RGBA16F', targetLog2: +target.toFixed(4) };
for (const hz of [60, 144, 240]) {
  for (const off of [-0.5, 0.5]) {
    write(target + off);
    const N = Math.round(hz * 12); // 12 s of simulated time: exp(-12 * 1.1) ~ 2e-6 of the error left
    for (let i = 0; i < N; i++) frame(1 / hz);
    out[`${hz}Hz start ${off > 0 ? '+' : ''}${off} stop`] = +(read() - target).toFixed(3);
  }
}
window.__res = out; window.__done = true;
</script></body></html>
