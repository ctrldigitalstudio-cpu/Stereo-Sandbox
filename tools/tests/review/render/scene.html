<!doctype html>
<html><body style="margin:0;background:#000">
<canvas id="c" style="width:480px;height:270px;display:block"></canvas>
<script type="module">
// Review check: a small real terrain (worldgen + mesher on the main thread, no worker) rendered by
// the Renderer; reports image statistics. ?nofloat hides EXT_color_buffer_float/_half_float.
const q = new URLSearchParams(location.search);
if (q.has('nofloat')) {
  const P = WebGL2RenderingContext.prototype, ge = P.getExtension;
  P.getExtension = function (n) { return (n === 'EXT_color_buffer_float' || n === 'EXT_color_buffer_half_float') ? null : ge.call(this, n); };
}
const { Renderer } = await import('../../../../src/renderer.js');
const { buildTextures } = await import('../../../../src/textures.js');
const { WorldGen } = await import('../../../../src/worldgen.js');
const { meshChunk } = await import('../../../../src/mesher.js');
const tex = buildTextures();
const canvas = document.getElementById('c');
const settings = { shadows: true, shadowRes: 1024, shadowRadius: 64, volumetrics: Number(q.get('vol') || 0), clouds: Number(q.get('clouds') || 0), ssr: 0, bloom: true, fxaa: false, autoResolution: false, renderScale: 1, pcss: true, renderDistance: 3 };
const r = new Renderer(canvas, tex, settings);
const gl = r.gl;
const gen = new WorldGen(12345);
const sp = gen.findSpawn();
const scx = Math.floor(sp.x / 16), scz = Math.floor(sp.z / 16);
const R = 2, data = new Map();
const get = (cx, cz) => { const k = cx + ',' + cz; if (!data.has(k)) data.set(k, gen.generateChunk(cx, cz)); return data.get(k); };
for (let cz = scz - R; cz <= scz + R; cz++) for (let cx = scx - R; cx <= scx + R; cx++) {
  const nb = [];
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) nb.push(get(cx + dx, cz + dz));
  const m = meshChunk(nb, tex.faceLayers, cx, cz);
  r.terrain.upload(cx, cz, m);
}
const cam = [sp.x + 0.5, sp.y + (Number(q.get('up')) || 6), sp.z + 0.5];
const tod = Number(q.get('tod') || 0.3);
let t = 0, n = 0;
function frame() { t += 1 / 60; r.render({ camPos: cam, yaw: Number(q.get('yaw') || 0.6), pitch: Number(q.get('pitch') || -0.35), fov: 1.3, time: 10, dt: 1 / 60, timeOfDay: tod, underwater: false, eyeSkyLight: 1, cloudCoverage: 0.3 }); }
function grab() {
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const px = new Uint8Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return { w, h, px };
}
for (let i = 0; i < 40; i++) frame();
const a = grab();
const url0 = canvas.toDataURL('image/png');
frame();
const b = grab();
// temporal stability with a static camera and a frozen clock: only the frame index changes
let changed = 0, maxd = 0, sumd = 0;
for (let i = 0; i < a.px.length; i += 4) {
  const d = Math.max(Math.abs(a.px[i] - b.px[i]), Math.abs(a.px[i + 1] - b.px[i + 1]), Math.abs(a.px[i + 2] - b.px[i + 2]));
  if (d > 6) changed++;
  maxd = Math.max(maxd, d); sumd += d;
}
// distinct colours and luminance histogram of the frame
const lum = new Uint32Array(256), distinct = new Set();
for (let i = 0; i < a.px.length; i += 4) { lum[Math.round(0.2126 * a.px[i] + 0.7152 * a.px[i + 1] + 0.0722 * a.px[i + 2])]++; distinct.add((a.px[i] << 16) | (a.px[i + 1] << 8) | a.px[i + 2]); }
let used = 0; for (const c of lum) if (c) used++;
window.__img = url0;
window.__res = { hdr: r.hdr.internal === gl.RGBA8 ? 'RGBA8' : 'RGBA16F', chunks: r.terrain.chunks.size, glError: gl.getError(), failed: [...r._failed],
  temporal: { pixelsChangedGt6: changed, of: a.px.length / 4, maxDiff: maxd, meanDiff: +(sumd / (a.px.length / 4)).toFixed(3) },
  distinctColours: distinct.size, lumLevelsUsed: used };
window.__done = true;
</script></body></html>
