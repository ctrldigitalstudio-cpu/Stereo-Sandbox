<!doctype html>
<html><body style="margin:0;background:#000">
<canvas id="c" style="width:320px;height:180px;display:block"></canvas>
<script type="module">
// Review check: GL errors / exceptions while toggling renderer settings at runtime (no world).
if (location.search.includes('halfonly')) {
  const P = WebGL2RenderingContext.prototype, ge = P.getExtension;
  P.getExtension = function (n) { return n === 'EXT_color_buffer_float' ? null : ge.call(this, n); };
}
const { Renderer } = await import('../../../../src/renderer.js');
const { buildTextures } = await import('../../../../src/textures.js');
const canvas = document.getElementById('c');
const base = { shadows: true, shadowRes: 1024, shadowRadius: 64, volumetrics: 12, clouds: 10, ssr: 16, bloom: true, fxaa: true, autoResolution: false, renderScale: 1, pcss: true };
const r = new Renderer(canvas, buildTextures(), base);
const gl = r.gl;
const out = [];
let t = 0;
const frame = (extra = {}) => { t += 1 / 60; r.render({ camPos: [0.5, 80, 0.5], yaw: 0.3, pitch: -0.1, fov: 1.3, time: t, dt: 1 / 60, timeOfDay: 0.3, underwater: false, eyeSkyLight: 1, cloudCoverage: 0.5, held: { blockId: 1, swing: 0, equip: 0, bobX: 0, bobY: 0, light: [1, 0] }, selection: { x: 0, y: 79, z: -3, id: 1 }, ...extra }); };
const steps = [
  ['base', {}], ['shadows off', { shadows: false }], ['shadows on 2048', { shadowRes: 2048 }], ['pcss off', { pcss: false }],
  ['bloom off', { bloom: false }], ['fxaa off', { fxaa: false }], ['scale .5', { renderScale: 0.5 }], ['scale .75 fxaa off', { renderScale: 0.75, fxaa: false }],
  ['vol+clouds off', { volumetrics: 0, clouds: 0 }], ['ssr off', { ssr: 0 }], ['all off', { shadows: false, bloom: false, fxaa: false, volumetrics: 0, clouds: 0, ssr: 0 }],
];
for (const [name, patch] of steps) {
  r.applySettings({ ...base, ...patch });
  for (const uw of [false, true]) {
    try { frame({ underwater: uw }); frame({ underwater: uw }); } catch (e) { out.push(`${name}${uw ? ' uw' : ''}: THROW ${e.message}`); }
    const e = gl.getError();
    if (e) out.push(`${name}${uw ? ' uw' : ''}: GL 0x${e.toString(16)}`);
  }
}
// Resize the canvas CSS size
canvas.style.width = '257px'; canvas.style.height = '143px';
await new Promise((res) => requestAnimationFrame(res));
r.resize(); frame(); frame();
{ const e = gl.getError(); if (e) out.push(`resize odd: GL 0x${e.toString(16)}`); }
window.__res = { hdr: r.hdr.internal === gl.RGBA8 ? 'RGBA8' : 'RGBA16F', halfExt: !!gl.getExtension('EXT_color_buffer_half_float'), failed: [...r._failed], errors: out, stats: r.stats };
window.__done = true;
</script></body></html>
