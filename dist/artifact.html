<title>Stereo Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Silkscreen&display=swap"></noscript>
<style>
/* Stereo Sandbox: page shell, menus, HUD and inventory.
   Visual language: frosted dark glass over the live world, warm off-white type, a golden-hour
   amber accent, small square-ish corners and crisp pixel details. */

:root {
  --bg: #0b0f16;
  --ink: #f3eee3;
  --ink-2: rgba(243, 238, 227, 0.74);
  --ink-3: rgba(243, 238, 227, 0.52);
  --ink-4: rgba(243, 238, 227, 0.3);
  --accent: #f2b45a;
  --accent-hi: #ffd08a;
  --accent-lo: #c9832e;
  --accent-ink: #251606;
  --accent-soft: rgba(242, 180, 90, 0.16);
  --danger: #ee7a64;
  --danger-ink: #2a0d07;

  --glass: rgba(13, 17, 25, 0.66);
  --glass-strong: rgba(13, 17, 25, 0.84);
  --glass-solid: rgba(15, 19, 28, 0.95);
  --well: rgba(255, 250, 240, 0.045);
  --well-hi: rgba(255, 250, 240, 0.085);
  --edge: rgba(255, 244, 222, 0.1);
  --edge-hi: rgba(255, 244, 222, 0.17);
  --shadow: 0 24px 64px -16px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.3);
  --highlight: inset 0 1px 0 rgba(255, 248, 232, 0.08);

  --radius: 4px;
  --radius-sm: 2px;
  --gutter: 16px;
  --blur: blur(18px) saturate(1.25);

  --font-display: "Silkscreen", "Pixelify Sans", ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --slot: 48px;
  --icon: 32px;
  --inv-gap: 4px;
  /* Inventory slots shrink on short windows so 6 grid rows + the hotbar row always fit. */
  --inv-chrome: 220px;
  --inv-slot-h: max(24px, calc((100vh - 2 * var(--gutter) - var(--inv-chrome)) / 7));
  --inv-slot: min(48px, var(--inv-slot-h));
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --t-fast: 120ms;
  --t-med: 200ms;

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--bg);
  touch-action: none;
  outline: none;
}

/* #ui itself creates no stacking context, so the crosshair can blend with the canvas. */
#ui {
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

#ui [hidden] { display: none !important; }

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.px { display: block; flex: none; }
.px-accent { fill: var(--accent); }

kbd { font: inherit; }

/* ---------- screens ---------- */

.screen {
  position: fixed;
  inset: 0;
  z-index: 20;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--t-med) ease, visibility 0s linear var(--t-med);
}
.screen.is-open {
  opacity: 1;
  visibility: visible;
  transition: opacity var(--t-med) ease, visibility 0s;
}

.scrim {
  display: grid;
  grid-template: minmax(0, 1fr) / minmax(0, 1fr);
  place-items: center;
  padding: max(var(--gutter), env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right))
    max(var(--gutter), env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left));
  background:
    radial-gradient(ellipse 70% 60% at 50% 50%, rgba(7, 10, 16, 0.3), rgba(7, 10, 16, 0.62)),
    rgba(7, 10, 16, 0.18);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  overflow: hidden;
  overflow: clip;   /* not a scroll container: nothing can scroll the panel out of place */
}
.scrim-light {
  background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(7, 10, 16, 0.2), rgba(7, 10, 16, 0.5));
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}

.panel {
  position: relative;
  width: min(100%, 360px);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  box-shadow: var(--highlight), var(--shadow);
  transform: translateY(6px) scale(0.99);
  transition: transform var(--t-med) var(--ease-out);
}
.is-open > .panel { transform: none; }
.panel-wide { width: min(100%, 680px); }

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .panel { background: var(--glass-solid); }
  .scrim { background: rgba(7, 10, 16, 0.55); }
}

.panel-title {
  margin: 0;
  font: 400 24px/1 var(--font-display);
  letter-spacing: 0.02em;
  color: var(--ink);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
}

.panel-head {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--edge);
}
.panel-head > :first-child { justify-self: start; }
.panel-head > :last-child { justify-self: end; }
.panel-head-spacer { width: 1px; }

.panel-body {
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(243, 238, 227, 0.22) transparent;
}
.panel-body::-webkit-scrollbar { width: 8px; }
.panel-body::-webkit-scrollbar-thumb { background: rgba(243, 238, 227, 0.2); border-radius: 0; }

.hint {
  margin: 0;
  color: var(--ink-3);
  font-size: 13px;
  line-height: 1.45;
}

.section-title {
  margin: 0 0 10px;
  font: 400 16px/1 var(--font-display);
  color: var(--accent);
  letter-spacing: 0.02em;
}

/* ---------- buttons ---------- */

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 18px 2px;
  font: 400 16px/1 var(--font-display);
  letter-spacing: 0.02em;
  color: var(--ink);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
  background: linear-gradient(rgba(255, 250, 240, 0.09), rgba(255, 250, 240, 0.04));
  border: 1px solid var(--edge-hi);
  border-radius: var(--radius-sm);
  box-shadow: inset 0 1px 0 rgba(255, 250, 240, 0.1), inset 0 -3px 0 rgba(0, 0, 0, 0.28);
  transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  background: linear-gradient(rgba(255, 250, 240, 0.15), rgba(255, 250, 240, 0.08));
  border-color: rgba(242, 180, 90, 0.6);
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
  box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.3);
}

.btn-primary {
  color: var(--accent-ink);
  text-shadow: 0 1px 0 rgba(255, 236, 200, 0.45);
  background: linear-gradient(#f8c677, #eca748);
  border-color: rgba(255, 214, 150, 0.75);
  box-shadow: inset 0 1px 0 rgba(255, 246, 225, 0.6), inset 0 -3px 0 rgba(140, 72, 0, 0.35), 0 0 28px -4px rgba(242, 180, 90, 0.45);
}
.btn-primary:hover:not(:disabled) {
  background: linear-gradient(#ffd48d, #f2b156);
  border-color: rgba(255, 228, 180, 0.95);
}
.btn-primary:active:not(:disabled) { box-shadow: inset 0 2px 0 rgba(140, 72, 0, 0.35); }

.btn:disabled { color: var(--ink-3); }
.btn-primary:disabled {
  color: rgba(243, 238, 227, 0.55);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
  background: linear-gradient(rgba(255, 250, 240, 0.08), rgba(255, 250, 240, 0.03));
  border-color: var(--edge);
  box-shadow: inset 0 1px 0 rgba(255, 250, 240, 0.06), inset 0 -3px 0 rgba(0, 0, 0, 0.25);
}

.btn-wide { width: 100%; }

.btn-ghost {
  min-height: 36px;
  padding: 0 10px 2px;
  gap: 8px;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--ink-2);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--well-hi);
  border-color: var(--edge);
  color: var(--ink);
}
.btn-ghost:active:not(:disabled) { box-shadow: none; }

.btn-quiet-danger { color: var(--ink-2); }
.btn-quiet-danger:hover:not(:disabled) { color: #ffb4a4; border-color: rgba(238, 122, 100, 0.6); }

.btn-danger {
  color: var(--danger-ink);
  text-shadow: none;
  background: linear-gradient(#f39683, #e0664e);
  border-color: rgba(255, 180, 160, 0.7);
  box-shadow: inset 0 1px 0 rgba(255, 230, 220, 0.5), inset 0 -3px 0 rgba(110, 20, 0, 0.35);
}
.btn-danger:hover:not(:disabled) {
  background: linear-gradient(#f8a794, #e87359);
  border-color: rgba(255, 200, 185, 0.9);
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.menu-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.menu-row > .btn { padding-inline: 10px; }

/* ---------- boot splash + title ---------- */

.title-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right))
    max(14px, env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left));
  overflow: hidden;
  overflow: clip;
}
/* Legibility over any sky: a soft dark halo behind the menu plus a darker floor. */
.title-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 46% 52% at 50% 50%, rgba(6, 9, 15, 0.46), rgba(6, 9, 15, 0) 72%),
    linear-gradient(to bottom, rgba(6, 9, 15, 0.3), rgba(6, 9, 15, 0) 28%, rgba(6, 9, 15, 0) 62%, rgba(6, 9, 15, 0.58));
}

.title-main {
  position: relative;
  margin: auto 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(28px, 6.5vh, 56px);
  padding: 12px 0;
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.logo-mark {
  width: 64px;
  height: 64px;
  margin-bottom: 18px;
  image-rendering: pixelated;
  filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.35)) drop-shadow(0 0 22px rgba(242, 180, 90, 0.35));
}

.logo {
  margin: 0;
  /* One line, as large as fits: "Stereo Sandbox" is ~9.5em wide in the pixel face. */
  font: 400 min(92px, calc((100vw - 2 * var(--gutter) - 16px) / 9.6))/0.9 var(--font-display);
  letter-spacing: -0.05em;
  padding-left: 0.05em;
  color: #fff4df;
  filter: drop-shadow(0 5px 0 rgba(58, 30, 4, 0.55)) drop-shadow(0 0 30px rgba(242, 170, 80, 0.42));
  white-space: nowrap;
}
/* The golden-hour gradient per word, so it reads the same when the words stack on phones. */
.logo-word {
  display: inline-block;
  background: linear-gradient(#fff9ee 0%, #ffe2ae 48%, #f2b45a 52%, #f6c77c 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.tagline {
  margin: 16px 0 0;
  font: 600 13px/1 var(--font-body);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  text-indent: 0.32em;
  color: var(--ink-2);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6), 0 0 18px rgba(0, 0, 0, 0.5);
}

.title-menu {
  width: min(100%, 340px);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.title-menu .btn {
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
}
.title-menu .btn:not(.btn-primary) { background-color: rgba(13, 17, 25, 0.45); }

.play-wrap { position: relative; }
.btn-play {
  width: 100%;
  min-height: 56px;
  font-size: 24px;
}
.title-screen:not(.is-ready) .btn-play { background-color: rgba(13, 17, 25, 0.55); }

.progress {
  position: absolute;
  left: 1px;
  right: 1px;
  bottom: 1px;
  height: 4px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.35);
  pointer-events: none;
  transition: opacity 400ms ease;
}
.progress-fill {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi));
  box-shadow: 0 0 10px rgba(242, 180, 90, 0.8);
  transform-origin: left center;
  transform: scaleX(0);
  transition: transform 300ms var(--ease-out);
}
.is-ready .progress { opacity: 0; }

.title-status {
  margin: 4px 0 0;
  min-height: 1.45em;
  text-align: center;
  font-size: 13px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
}
.is-ready .title-status { color: var(--ink-3); }

.touch-note {
  display: none;
  margin: 6px 0 0;
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.45;
  text-align: center;
  color: var(--ink-2);
  background: var(--glass);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
}
@media (hover: none) and (pointer: coarse) {
  .touch-note { display: block; }
}

.title-footer {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 12px;
  color: var(--ink-3);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
}

/* Static splash in index.html, shown while the modules load; cross-fades into the title. */
.boot {
  z-index: 60;
  opacity: 1;
  visibility: visible;
  background: var(--bg);
  transition: opacity 600ms ease;
}
.boot::before { display: none; }
.boot.is-leaving { opacity: 0; pointer-events: none; }
.boot .title-menu { min-height: 143px; align-items: center; justify-content: flex-end; }
.boot-status {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
}
.boot-status::after {
  content: "";
  display: inline-block;
  width: 3px;
  height: 3px;
  margin-left: 6px;
  background: var(--accent);
  box-shadow: 6px 0 0 var(--accent), 12px 0 0 var(--accent);
  vertical-align: middle;
  animation: boot-dots 1.2s steps(1, end) infinite;
}
@keyframes boot-dots {
  0% { box-shadow: 6px 0 0 transparent, 12px 0 0 transparent; }
  33% { box-shadow: 6px 0 0 var(--accent), 12px 0 0 transparent; }
  66% { box-shadow: 6px 0 0 var(--accent), 12px 0 0 var(--accent); }
}
.boot .logo-mark { visibility: hidden; }
.boot-status.is-error { color: var(--danger); }
.boot-status.is-error::after { display: none; }

/* ---------- pause ---------- */

.pause-panel {
  width: min(100%, 360px);
  padding: 26px 22px 20px;
  gap: 20px;
  text-align: center;
  overflow-y: auto;
  scrollbar-width: thin;
}
.pause-panel .panel-title { font-size: 32px; }

.confirm {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 14px 14px;
  text-align: left;
  background: rgba(238, 122, 100, 0.08);
  border: 1px solid rgba(238, 122, 100, 0.35);
  border-radius: var(--radius-sm);
}
.confirm-title {
  margin: 0;
  font: 400 16px/1.2 var(--font-display);
  color: #ffc2b4;
}
.confirm-text {
  margin: 0 0 6px;
  font-size: 14px;
  color: var(--ink-2);
}

/* ---------- settings ---------- */

.settings-panel { height: min(100%, 700px); }

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 10px 14px 0;
  border-bottom: 1px solid var(--edge);
}
.tab {
  position: relative;
  padding: 9px 12px 12px;
  font: 600 14px/1 var(--font-body);
  color: var(--ink-3);
  background: transparent;
  border: 0;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  transition: color var(--t-fast), background-color var(--t-fast);
}
.tab:hover { color: var(--ink); background: var(--well); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -1px;
  height: 3px;
  background: var(--accent);
  box-shadow: 0 0 12px rgba(242, 180, 90, 0.6);
}
.tab:focus-visible { outline-offset: -2px; }

.settings-body {
  flex: 1;
  padding: 4px 14px 18px;
  /* Soft fade at the bottom edge hints that the list scrolls. */
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent);
}

.setting {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
  align-items: center;
  gap: 8px 16px;
  min-height: 50px;
  padding: 7px 4px;
  border-bottom: 1px solid rgba(255, 244, 222, 0.06);
  transition: opacity var(--t-fast);
}
.setting:last-child { border-bottom: 0; }
.setting.is-disabled { opacity: 0.42; }

.setting-label {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
}

.setting-control {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  min-width: 0;
}

.setting-value {
  flex: none;
  min-width: 5.2em;
  text-align: right;
  font: 600 14px/1 var(--font-body);
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}

/* Range: square pixel thumb over a filled track. */
.range {
  flex: 1;
  min-width: 0;
  height: 28px;
  margin: 0;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
  --fill: 50%;
}
.range:disabled { cursor: default; }
.range::-webkit-slider-runnable-track {
  height: 6px;
  background: linear-gradient(90deg, var(--accent) var(--fill), rgba(255, 250, 240, 0.12) var(--fill));
  border-radius: 0;
  box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.35);
}
.range::-moz-range-track {
  height: 6px;
  background: rgba(255, 250, 240, 0.12);
  box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.35);
}
.range::-moz-range-progress { height: 6px; background: var(--accent); }
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 20px;
  margin-top: -7px;
  background: var(--ink);
  border: 2px solid #1a1d24;
  border-radius: 0;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22), 0 2px 0 rgba(0, 0, 0, 0.35);
  transition: background-color var(--t-fast);
}
.range::-moz-range-thumb {
  width: 12px;
  height: 16px;
  background: var(--ink);
  border: 2px solid #1a1d24;
  border-radius: 0;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22), 0 2px 0 rgba(0, 0, 0, 0.35);
}
.range:hover:not(:disabled)::-webkit-slider-thumb { background: var(--accent-hi); }
.range:hover:not(:disabled)::-moz-range-thumb { background: var(--accent-hi); }
.range:focus-visible { outline-offset: 0; }

/* Toggle switch: a square pixel thumb that slides; amber when on. */
.switch-state {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
  min-width: 2em;
  text-align: right;
}
.switch {
  position: relative;
  flex: none;
  width: 48px;
  height: 26px;
  padding: 0;
  background: rgba(255, 250, 240, 0.1);
  border: 1px solid var(--edge-hi);
  border-radius: var(--radius-sm);
  box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.3);
  transition: background-color var(--t-fast), border-color var(--t-fast);
}
.switch-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  background: var(--ink-2);
  border-radius: 1px;
